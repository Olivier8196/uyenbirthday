<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, My Bao boi 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .content {
      width: 100%;
      max-width: 500px;
      padding: 35px 22px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 8px 30px rgba(60, 100, 140, 0.12);
    }

    h1 {
      color: #315879;
      font-size: 34px;
      margin-bottom: 14px;
    }

    p {
      color: #54799F;
      font-size: 18px;
      line-height: 1.6;
    }

    .video-link {
      display: inline-block;
      margin-top: 20px;
      padding: 17px 25px;
      background: white;
      color: #54799F;
      border-radius: 15px;
      text-decoration: none;
      font-size: 19px;
      box-shadow: 0 4px 15px rgba(80, 120, 160, 0.15);
    }

    .video-link:hover {
      transform: scale(1.04);
    }

    @media (max-width: 600px) {
      body {
        background-attachment: scroll;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="content">
    <h1>Happy Birthday, my love 💙</h1>

    <p>I made something special for you...</p>

    <a
      class="video-link"
      href="https://drive.google.com/file/d/1YYT3FzIzLhOFvER1YNhgcMr1jjEYwlMP/view?usp=drivesdk"
      target="_blank"
      rel="noopener noreferrer">
      ▶ A little song for you ♡
    </a>

    <p>With love, always. ❤️</p>
  </main>
</body>
</html>
